<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jay Grafwallner | Senior Full Stack Software Engineer</title>
    <meta
      name="description"
      content="Senior full-stack engineer with 10+ years delivering web applications across C#/.NET, React, TypeScript, SQL Server, Azure, and production RAG infrastructure."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jay Grafwallner | Senior Full Stack Software Engineer" />
    <meta
      property="og:description"
      content="Web applications and production AI systems, from architecture and data modeling to automated deployment and production support."
    />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var dark;
        try {
          var stored = localStorage.getItem('theme');
          if (stored) dark = stored === 'dark';
        } catch (e) {}
        if (dark === undefined) dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
